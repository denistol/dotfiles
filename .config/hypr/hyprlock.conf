background {
    monitor =
    path = /home/denis/.config/hypr/wallpapers/dark_mountains.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(203, 166, 247)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgb(205, 214, 244)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = Welcome back, $USER
    color = rgb(186, 194, 222)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.28 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 0.8)
    inner_color = rgba(30, 30, 46, 0.75)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}
