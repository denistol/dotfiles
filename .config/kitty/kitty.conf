# Shell configuration
shell /bin/zsh

# Font settings - JetBrains Mono Nerd Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.4

# Window styling & padding
window_padding_width 2
background_opacity 0.95
background_blur 5
confirm_os_window_close 0

# Modern Dark / Catppuccin Mocha Color Scheme
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor settings
cursor                  #F5E0DC
cursor_text_color       #1E1E2E
cursor_shape            block
shell_integration       no-cursor

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# Tab bar colors
map --allow-fallback=shifted,ascii ctrl+t new_tab
map --allow-fallback=shifted,ascii ctrl+shift+w close_tab
map ctrl+е new_tab
map ctrl+shift+ц close_tab
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# The 16 terminal colors
# black
color0 #45475A
color8 #585B70
# red
color1 #F38BA8
color9 #F38BA8
# green
color2  #A6E3A1
color10 #A6E3A1
# yellow
color3  #F9E2AF
color11 #F9E2AF
# blue
color4  #89B4FA
color12 #89B4FA
# magenta
color5  #F5C2E7
color13 #F5C2E7
# cyan
color6  #94E2D5
color14 #94E2D5
# white
color7  #BAC2DE
color15 #A6ADC8

# Keybindings: Smart Copy & Paste (works in English and Russian layouts)
# If text is selected, Ctrl+C copies it; if not, it sends SIGINT (interrupts command)
map --allow-fallback=shifted,ascii ctrl+c copy_and_clear_or_interrupt
map --allow-fallback=shifted,ascii ctrl+v paste_from_clipboard
map ctrl+с copy_and_clear_or_interrupt
map ctrl+м paste_from_clipboard

# Standard terminal copy/paste alternatives
map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard
map ctrl+shift+с copy_to_clipboard
map ctrl+shift+м paste_from_clipboard
